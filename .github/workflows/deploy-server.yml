# 게임 서버를 배포한다. Actions 탭에서 직접 실행한다.
#   1) server/ 이미지를 GHCR에 올린다 (비밀값은 이미지에 넣지 않는다)
#   2) SSH로 서버에 접속해 .env를 secret과 variable에서 바로 쓰고 docker compose로 다시 띄운다
#   3) https://SERVER_DOMAIN/healthz 로 바깥에서 응답을 확인한다 (Caddy가 HTTPS 인증서를 자동 발급)
# GCP VM(server/deploy/setup-gcp.sh)은 SSH가 공개되지 않아, GCP_* secret이 있으면 키 파일 없이
# Workload Identity로 인증한 뒤 IAP 터널로 접속한다. 없으면 DEPLOY_HOST로 바로 SSH 접속한다.
# 서버 준비는 server/deploy/setup-vm.sh 한 번으로 끝난다 (Docker·스왑·배포 사용자).
# 필요한 secret과 variable: docs/deploy.md '비밀값 관리'
# 주의: 이 서버(v2)는 /v2만 받는다. 앱이 /v2를 부르게 바뀌기 전에 배포하면 지금의 앱이 부르는 /v1이 사라진다 (docs/deploy.md).
#       그래서 저장소 variable ALLOW_SERVER_V2_DEPLOY가 yes일 때만 진행한다 (맨 앞의 '배포 잠금 확인')
name: 서버 배포

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  image:
    name: 이미지 빌드·업로드
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      # 이 서버(v2)는 /v2만 받는다. 앱이 /v2를 부르는 버전으로 나가기 전에 실수로 누른 배포를 여기서 막는다 (이미지를 올리기 전)
      - name: 배포 잠금 확인
        env:
          ALLOW_SERVER_V2_DEPLOY: ${{ vars.ALLOW_SERVER_V2_DEPLOY }}
        run: |
          if [ "$ALLOW_SERVER_V2_DEPLOY" != "yes" ]; then
            echo "::error::variable ALLOW_SERVER_V2_DEPLOY가 yes가 아니에요. 앱이 /v2를 부르는 버전으로 나간 뒤에 이 값을 넣으세요. 지금 배포하면 /v1이 사라져요"
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: 이미지 이름
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/arcade-box-server:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.name.outputs.image }}

  deploy:
    name: 서버에 배포
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write # GCP Workload Identity 인증용 (키 파일 없이 짧게 유효한 토큰)
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      # 아래 셋은 비밀값이 아니라 variable로 둔다 (앱에도 그대로 들어가는 값이다)
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
      BUNDLE_PUBLIC_KEY: ${{ vars.BUNDLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: secret 확인
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS SERVER_DOMAIN POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::다음 secret이 없어요:$missing"; exit 1; fi
          if { [ -n "$CF_ORIGIN_CERT" ] && [ -z "$CF_ORIGIN_KEY" ]; } || { [ -z "$CF_ORIGIN_CERT" ] && [ -n "$CF_ORIGIN_KEY" ]; }; then
            echo "::error::CF_ORIGIN_CERT와 CF_ORIGIN_KEY는 둘 다 넣거나 둘 다 비워 주세요"; exit 1
          fi
          if [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && { [ -z "$GCP_PROJECT_ID" ] || [ -z "$GCP_SERVICE_ACCOUNT" ]; }; then
            echo "::error::GCP로 배포하려면 GCP_PROJECT_ID와 GCP_SERVICE_ACCOUNT secret도 필요해요"; exit 1
          fi
          # DB 주소(postgres://user:비밀번호@...)에 그대로 들어가므로 특수문자를 받지 않는다
          case "$POSTGRES_PASSWORD" in
            *[!A-Za-z0-9_-]*) echo "::error::POSTGRES_PASSWORD는 영문·숫자·-·_만 써 주세요 (예: openssl rand -hex 32)"; exit 1 ;;
          esac
          # 도메인 이름만 받는다 (https:// 나 경로 없이, 예: arcade-api.geonbox.com)
          case "$SERVER_DOMAIN" in
            *[!A-Za-z0-9.-]*|"") echo "::error::SERVER_DOMAIN에는 도메인 이름만 넣어 주세요 (예: arcade-api.geonbox.com)"; exit 1 ;;
          esac
          # 아래 값은 .env에 한 줄씩 그대로 들어간다. 줄바꿈·빈칸·따옴표가 섞이지 않게 쓰는 글자를 정해 둔다 (값은 찍지 않는다)
          case "$ALLOWED_ORIGINS" in
            *[!A-Za-z0-9.:/,_-]*) echo "::error::variable ALLOWED_ORIGINS에는 origin을 쉼표로 이어 넣어 주세요 (예: https://localhost,capacitor://localhost)"; exit 1 ;;
          esac
          case "$GOOGLE_CLIENT_IDS" in
            *[!A-Za-z0-9.,_-]*) echo "::error::variable GOOGLE_CLIENT_IDS에는 클라이언트 ID를 쉼표로 이어 넣어 주세요 (빈칸 없이)"; exit 1 ;;
          esac
          case "$BUNDLE_PUBLIC_KEY" in
            *[!A-Za-z0-9+/=]*) echo "::error::variable BUNDLE_PUBLIC_KEY에는 공개 키의 base64 한 줄만 넣어 주세요 (-----BEGIN 줄 없이)"; exit 1 ;;
          esac
          # 없어도 서버는 뜬다. 다만 그 기능이 막히니 알려 준다
          if [ -z "$GOOGLE_CLIENT_IDS" ]; then echo "::warning::variable GOOGLE_CLIENT_IDS가 없어요. 구글 계정 연결이 모두 거절돼요"; fi
          if [ -z "$BUNDLE_PUBLIC_KEY" ]; then echo "::warning::variable BUNDLE_PUBLIC_KEY가 없어요. 게임 묶음을 올릴 수 없어요 (game add-version)"; fi

      - name: GCP 인증 (Workload Identity)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: gcloud 준비
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          # 서버 진위를 known_hosts로 확인한다 (StrictHostKeyChecking을 끄지 않는다)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host deploy-target"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port ${DEPLOY_PORT:-22}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            if [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]; then
              # 공개 SSH 없이 구글 IAP 터널로 접속한다. known_hosts는 VM 이름으로 맞춘다
              echo "  HostKeyAlias $DEPLOY_HOST"
              echo "  ProxyCommand gcloud compute start-iap-tunnel %h 22 --listen-on-stdin --project=$GCP_PROJECT_ID --zone=${GCP_ZONE:-us-west1-b} --verbosity=warning"
            fi
          } > ~/.ssh/config

      - name: 설정 쓰고 다시 띄우기
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
          SERVER_IMAGE: ${{ needs.image.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote() { ssh deploy-target "$@"; }

          # 비밀값은 표준 입력으로만 넘긴다 — 명령줄·로그에 남기지 않는다
          remote 'umask 077 && mkdir -p ~/arcade-box/certs'
          remote 'cat > ~/arcade-box/docker-compose.yml' < server/docker-compose.yml
          remote 'cat > ~/arcade-box/Caddyfile' < server/Caddyfile
          # Cloudflare 프록시 뒤라면 Origin 인증서를 쓰고, 아니면 Let's Encrypt 자동 발급
          if [ -n "$CF_ORIGIN_CERT" ]; then
            printf '%s\n' "$CF_ORIGIN_CERT" | remote 'umask 077 && cat > ~/arcade-box/certs/origin.pem'
            printf '%s\n' "$CF_ORIGIN_KEY" | remote 'umask 077 && cat > ~/arcade-box/certs/origin.key'
            CADDY_TLS=tls-origin
          else
            CADDY_TLS=tls-auto
          fi
          {
            echo "DOMAIN=$SERVER_DOMAIN"
            echo "CADDY_TLS=$CADDY_TLS"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
            echo "GOOGLE_CLIENT_IDS=$GOOGLE_CLIENT_IDS"
            echo "BUNDLE_PUBLIC_KEY=$BUNDLE_PUBLIC_KEY"
            echo "SERVER_IMAGE=$SERVER_IMAGE"
          } | remote 'umask 077 && cat > ~/arcade-box/.env'

          # 이 작업 동안만 유효한 토큰으로 이미지를 받고 바로 로그아웃한다
          printf '%s' "$GHCR_TOKEN" | remote "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          remote 'cd ~/arcade-box && docker compose pull server; status=$?; docker logout ghcr.io >/dev/null; exit $status'
          remote 'cd ~/arcade-box && docker compose up -d --no-build'

      - name: 상태 확인
        run: |
          remote() { ssh deploy-target "$@"; }
          for i in $(seq 1 20); do
            if remote 'cd ~/arcade-box && docker compose exec -T server wget -qO- http://127.0.0.1:8080/healthz' >/dev/null 2>&1; then
              echo "서버가 응답해요"
              break
            fi
            if [ "$i" = 20 ]; then
              echo "::error::서버가 60초 안에 응답하지 않았어요"
              remote 'cd ~/arcade-box && docker compose ps && docker compose logs --tail 50 server'
              exit 1
            fi
            sleep 3
          done
          # 바깥에서 HTTPS로 — 첫 배포 때는 인증서 발급에 시간이 걸릴 수 있다
          for i in $(seq 1 24); do
            if curl -sf --max-time 10 "https://$SERVER_DOMAIN/healthz" >/dev/null; then
              echo "https://$SERVER_DOMAIN 에서 응답해요"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$SERVER_DOMAIN/healthz 가 2분 안에 응답하지 않았어요. 도메인이 서버 IP를 가리키는지, 방화벽에서 80·443이 열려 있는지 확인해 주세요"
          remote 'cd ~/arcade-box && docker compose logs --tail 50 caddy'
          exit 1

      - name: SSH 키 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key
