# 미니앱 번들을 secret 값으로 빌드해 앱인토스 콘솔에 올린다. Actions 탭에서 직접 실행한다.
# 필요한 secret: AIT_API_KEY, VITE_API_BASE, VITE_REWARDED_AD_GROUP_ID(ads=real일 때) — README '비밀값 관리'
#
# 광고(ads):
#   test(기본) — 테스트 광고 ID로 빌드한다. 폰 테스트용. 광고 문서: "실제 광고 ID로 테스트하면 정책 위반으로 간주"
#   real       — 콘솔 광고 그룹 ID로 빌드한다. 검수에 낼 번들만 이렇게 올린다
# 콘솔 메모 앞에 [테스트 광고]/[실제 광고]가 붙어서 버전 내역에서 구분된다.
name: 미니앱 배포

on:
  workflow_dispatch:
    inputs:
      memo:
        description: 배포 메모 (콘솔에 함께 남아요, 1000자 이내)
        required: false
        default: ''
      ads:
        description: 광고 — test(폰 테스트용, 기본) / real(검수에 낼 번들만)
        required: true
        type: choice
        options:
          - test
          - real
        default: test

permissions:
  contents: read

concurrency:
  group: deploy-miniapp
  cancel-in-progress: false

jobs:
  deploy:
    name: 빌드·업로드
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: secret 확인
        env:
          AIT_API_KEY: ${{ secrets.AIT_API_KEY }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_REWARDED_AD_GROUP_ID: ${{ secrets.VITE_REWARDED_AD_GROUP_ID }}
          ADS: ${{ inputs.ads }}
        run: |
          if [ -z "$AIT_API_KEY" ]; then echo "::error::AIT_API_KEY secret이 없어요"; exit 1; fi
          case "$VITE_API_BASE" in
            https://*) ;;
            *) echo "::error::VITE_API_BASE secret은 https 주소여야 해요"; exit 1 ;;
          esac
          if [ "$ADS" = "real" ]; then
            if [ -z "$VITE_REWARDED_AD_GROUP_ID" ]; then echo "::error::ads=real인데 VITE_REWARDED_AD_GROUP_ID secret이 없어요"; exit 1; fi
            echo "::notice::실제 광고 그룹 ID로 빌드해요 — 검수에 낼 번들이에요. 이 번들로 광고를 테스트하지 마세요"
          else
            echo "::notice::테스트 광고 ID로 빌드해요 — 폰 테스트용 번들이에요. 검수에 낼 번들은 ads=real로 다시 배포하세요"
          fi

      # 디버그 빌드 플래그(AIT_DEBUG_BUILD)는 넣지 않는다 — 검수·출시용 릴리즈 빌드
      - name: 빌드
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          # ads=test면 비워 둔다 → 앱이 테스트 광고 ID(ait-ad-test-rewarded-id)를 쓴다
          VITE_REWARDED_AD_GROUP_ID: ${{ inputs.ads == 'real' && secrets.VITE_REWARDED_AD_GROUP_ID || '' }}
        run: npm run build

      # npx 대신 설치된 bin을 직접 부른다 — 레지스트리의 다른 'ait' 패키지를 받아 실행하지 않도록
      - name: 콘솔에 업로드
        env:
          AIT_API_KEY: ${{ secrets.AIT_API_KEY }}
          MEMO: ${{ inputs.memo }}
          ADS: ${{ inputs.ads }}
        run: |
          if [ "$ADS" = "real" ]; then TAG="[실제 광고]"; else TAG="[테스트 광고]"; fi
          ./node_modules/.bin/ait deploy --api-key "$AIT_API_KEY" -m "$TAG $MEMO"
