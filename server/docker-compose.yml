# 운영 구성: 서버 + PostgreSQL + Caddy(HTTPS).
#   직접 띄우기: .env.example을 .env로 복사해 채운 뒤 docker compose up -d --build
#   GitHub Actions '서버 배포' 워크플로는 이 파일과 Caddyfile을 서버로 복사하고, .env를 secret과 variable로 채워 SERVER_IMAGE를 받아 띄운다.
# 바깥에서는 Caddy(80·443)로만 들어온다. 관리 기능은 HTTP로 열지 않고, 서버 컨테이너 안의 명령줄 도구로 한다 (scripts/admin.sh).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pinball
      POSTGRES_USER: pinball
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 지정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinball -d pinball"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    # 직접 띄울 때는 이 폴더에서 빌드하고, 배포 워크플로는 GHCR에 올린 이미지(SERVER_IMAGE)를 받아 쓴다
    image: ${SERVER_IMAGE:-arcade-box-server}
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # production에서는 개발용 가짜 로그인(AUTH_DEV)을 켠 채로 뜨지 않는다
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://pinball:${POSTGRES_PASSWORD}@db:5432/pinball
      # 게임 묶음과 아이콘을 두는 곳 — 아래 data 볼륨
      DATA_DIR: /data
      # 앱의 origin (쉼표로 여러 개). 비우면 서버 기본값: https://localhost(안드로이드), capacitor://localhost(아이폰)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # 구글 로그인의 대상(aud)으로 받아들이는 우리 앱의 클라이언트 ID (쉼표로 여러 개). 비우면 구글 연결이 모두 거절된다
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      # 게임 묶음의 서명을 확인하는 Ed25519 공개 키(base64). 비밀값이 아니다. 비우면 game add-version이 거절된다
      BUNDLE_PUBLIC_KEY: ${BUNDLE_PUBLIC_KEY:-}
      # 요청한 쪽의 IP를 읽는 헤더. Caddy가 직접 채운 헤더 하나만 믿는다: Cloudflare 대역에서 온 요청이면 CF-Connecting-IP의 값,
      # 그 밖이면 소켓의 상대 주소가 들어 있다 (Caddyfile). 앱이 보낸 값은 Caddy가 덮어써서 지어낼 수 없다
      CLIENT_IP_HEADER: x-real-ip
    volumes:
      - data:/data
    # 바깥에서는 Caddy(443)로만 들어온다. 8080은 이 서버 안에서만 연다
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # HTTPS — DOMAIN으로 인증서를 자동 발급·갱신하고 server로 넘긴다
  caddy:
    image: caddy:2-alpine
    depends_on:
      - server
    environment:
      DOMAIN: ${DOMAIN:?서버 도메인(DOMAIN)을 지정하세요}
      # tls-auto(Let's Encrypt 자동) 또는 tls-origin(Cloudflare Origin 인증서) — Caddyfile 참고
      CADDY_TLS: ${CADDY_TLS:-tls-auto}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  pgdata:
  # 게임 묶음과 아이콘. 지우면 올린 묶음이 사라진다 (DB의 버전 행은 남아 내려받기가 실패한다)
  data:
  caddy-data:
  caddy-config:
